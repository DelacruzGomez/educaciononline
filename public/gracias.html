<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gracias | Descarga tu guía</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 720px;
      background: rgba(17, 24, 39, 0.95);
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.12);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.35);
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.92rem;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.05;
    }
    p {
      color: #cbd5e1;
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 0 auto 18px;
      max-width: 58ch;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 22px;
    }
    .btn {
      display: inline-block;
      background: #f59e0b;
      color: #111827;
      padding: 14px 22px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      transition: background-color 0.2s, transform 0.2s;
    }
    .btn:hover {
      background: #d97706;
      transform: translateY(-1px);
    }
    .btn.outline {
      background: transparent;
      color: #e2e8f0;
      border: 1px solid #475569;
    }
    .btn.outline:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: #64748b;
    }
    .btn.return {
      border-color: #64748b;
      color: #94a3b8;
    }
    .btn.return:hover {
      color: #e2e8f0;
      border-color: #cbd5e1;
    }
    .note {
      margin-top: 18px;
      font-size: 0.92rem;
      color: #94a3b8;
    }
    
    /* Ajuste para que se vea excelente en celulares */
    @media (max-width: 540px) {
      .actions {
        flex-direction: column;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">¡Gracias!</div>
    <h1>Tu guía ya está lista</h1>
    <p>
      Ya puedes descargar el PDF con información adicional sobre el curso y revisar la página oficial si quieres ver todo el contenido.
    </p>

    <div class="actions">
      <a class="btn" href="/Guia_rapida.pdf" download>
        Descargar PDF
      </a>
      <a class="btn outline" href="https://go.hotmart.com/N106692793T" target="_blank" rel="noreferrer">
        Ver el curso
      </a>
      <!-- NUEVO BOTÓN: Regresa de forma directa a la raíz de tu sitio en Netlify -->
      <a class="btn outline return" href="/">
        ⬅️ Ver Otros Productos
      </a>
    </div>

    <div class="note">
      Si no se descarga automáticamente, usa el botón de descarga.
    </div>
  </main>
</body>
</html>

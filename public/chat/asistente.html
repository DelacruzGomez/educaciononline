<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal EducaDG</title>
    <!-- Incluir Tailwind CSS para estilizado moderno y responsivo -->
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: transparent;
            margin: 0;
            padding: 0;
        }
        
        .widget-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        #chatButton {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }
        #chatButton:hover {
            transform: scale(1.05);
        }

        #chatWindow {
            background-color: white;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
            width: 100%;
            height: 100%;
            display: none; 
            flex-direction: column;
            overflow: hidden;
            transform: scale(0.9);
            opacity: 0;
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
        }
        
        @media (max-width: 480px) {
            #chatWindow {
                max-width: calc(100vw - 40px);
                height: 70vh;
            }
        }

        #chatWindow.open {
            display: flex;
            transform: scale(1);
            opacity: 1;
        }

        .message-area {
            flex-grow: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            scroll-behavior: smooth;
        }
        .user-message {
            align-self: flex-end;
            background-color: #4f46e5; 
            color: white;
            padding: 0.6rem 0.9rem;
            border-radius: 0.75rem 0.75rem 0.25rem 0.75rem;
            max-width: 85%;
            word-break: break-word;
        }
        .bot-message {
            align-self: flex-start;
            background-color: #e0f2fe; 
            color: #1e40af; 
            padding: 0.6rem 0.9rem;
            border-radius: 0.75rem 0.75rem 0.75rem 0.25rem;
            max-width: 85%;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            word-break: break-word;
        }
        
        /* Enlaces Markdown adaptados dinámicamente para legibilidad según el contenedor */
        .user-message a {
            color: #ffffff !important;
            text-decoration: underline !important;
            font-weight: bold !important;
        }
        .bot-message a {
            color: #1e40af !important;
            text-decoration: underline !important;
            font-weight: bold !important;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            background-color: #4f46e5;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: bounce 0.8s infinite ease-in-out alternate;
        }
        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }
    </style>
</head>
<body>

<!-- Área de Mensajes -->
<div id="messageArea" class="message-area" style="height: calc(100vh - 60px); overflow-y: auto; padding: 1rem; box-sizing: border-box;">
    <!-- Los mensajes se inyectan de forma dinámica -->
</div>

<!-- Área de Entrada de Usuario -->
<!-- Área de Entrada de Usuario (Fijada exactamente al fondo del cuadro de React) -->
<div style="height: 60px; box-sizing: border-box; background-color: #ffffff; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-top: 1px solid #e5e7eb; width: 100%;">
    <input 
        type="text" 
        id="userInput" 
        placeholder="Escribe tu mensaje..." 
        style="flex-grow: 1; height: 38px; padding: 0 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; box-sizing: border-box; font-family: 'Inter', sans-serif; margin-right: 8px;"
        onkeypress="if(event.key === 'Enter') sendMessage()"
    >
    <button 
        id="sendButton"
        onclick="sendMessage()"
        style="background-color: #4f46e5; border: none; cursor: pointer; width: 38px; height: 38px; border-radius: 8px; display: flex; justify-content: center; align-items: center; color: #ffffff; transition: background-color 0.15s ease; box-sizing: border-box; flex-shrink: 0;"
        onmouseover="this.style.backgroundColor='#4338ca'"
        onmouseout="this.style.backgroundColor='#4f46e5'"
    >
        <svg xmlns="http://w3.org" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
    </button>
</div>

<script>
    // Referencias al DOM estables
    const messageArea = document.getElementById('messageArea');
    const userInput = document.getElementById('userInput');
    const sendButton = document.getElementById('sendButton');

    // Estado persistente del chat local
    let conversationHistory = [];
    const welcomeMessage = `Hola 👋 Soy el asistente virtual de Portal EducaDG. Estoy aquí para ayudarte a encontrar los mejores cursos online y programas ideales para llevar tu talento al siguiente nivel. 🚀 ¿En qué te puedo asesorar hoy?`;

    // Escuchar el saludo inicial seguro enviado desde entornos externos (ej. App.jsx)
    window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'INIT_CHAT') {
            if (messageArea.children.length === 0) {
                addMessage(event.data.text, 'model');
            }
        }
    });

    // 2. Función para añadir mensajes al área de chat (CON DETECTOR DE ENLACES MARKDOWN CORREGIDO)
    function addMessage(text, role) {
        if (!text || text.trim() === '') return;

        const messageDiv = document.createElement('div');
        messageDiv.classList.add(
            role === 'user' ? 'user-message' : 'bot-message',
            'whitespace-pre-wrap'
        );

        // Transforma [Texto](https://...) en etiquetas <a> válidas HTML5 para evitar textos crudos expuestos
        let textoFormateado = text.replace(
            /\[([^\]]+)\]\(([^)]+)\)/g, 
            '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
        );

        messageDiv.innerHTML = textoFormateado; 
        messageArea.appendChild(messageDiv);
        
        // CORRECCIÓN TÁCTICA: El historial se sincroniza centralizadamente AQUÍ para evitar duplicaciones
        if (text !== welcomeMessage && !text.startsWith("Escribiendo...")) {
            conversationHistory.push({ 
                role: role === 'user' ? 'user' : 'model', 
                text: text 
            });
        }
        
        messageArea.scrollTop = messageArea.scrollHeight;
    }

    // 3. Función para mostrar el indicador de carga del bot
    function showLoading() {
        const loadingDiv = document.createElement('div');
        loadingDiv.id = 'loadingIndicator';
        loadingDiv.classList.add('bot-message', 'flex', 'items-center', 'space-x-1');
        loadingDiv.innerHTML = `
            <span>Escribiendo...</span>
            <span class="loading-dot"></span>
            <span class="loading-dot"></span>
            <span class="loading-dot"></span>
        `;
        messageArea.appendChild(loadingDiv);
        messageArea.scrollTop = messageArea.scrollHeight;
        return loadingDiv;
    }
</script>
<script>
// 5. Función principal para enviar el mensaje (Sincronización Limpia y Segura)
async function sendMessage() {
    const userText = userInput.value.trim();
    if (userText === '') return;

    // Bloqueo de UI inmediato para prevenir peticiones concurrentes o dobles clics
    userInput.value = '';
    userInput.disabled = true;
    sendButton.disabled = true;

    // Inyecta visualmente el mensaje del usuario en pantalla
    addMessage(userText, 'user');

    // Mapeo riguroso al formato JSON estructural nativo compatible con tu backend (.contents -> role/parts)
    const payloadContents = conversationHistory.map(msg => ({
        role: msg.role === 'user' ? 'user' : 'model', 
        parts: [{ text: msg.text }]
    }));

    const loadingIndicator = showLoading();

    try {
        const payload = {
            contents: payloadContents
        };

        const coreUrl = "/.netlify/functions/gemini";

        const netOptions = {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        };

        let response = await window.fetch(coreUrl, netOptions);

        if (!response.ok) {
            throw new Error(`Error HTTP: ${response.status}`);
        }

        const result = await response.json();
        
        // Extracción segura bajo el estándar de respuesta del backend
        const botResponse = result.candidates?.[0]?.content?.parts?.[0]?.text || "Disculpa, no pude procesar tu solicitud. Intenta de nuevo.";
        
        if (loadingIndicator) {
            loadingIndicator.remove();
        }
        
        // Despacha la respuesta final generada por el Bot hacia la pantalla
        addMessage(botResponse, 'model'); 

    } catch (error) {
        console.error("Error al conectar con el backend de asistencia:", error);
        
        if (loadingIndicator) {
            loadingIndicator.remove();
        }
        
        // Remoción del último mensaje del historial si la red falló por completo
        conversationHistory.pop(); 
        
        addMessage("Lo siento, hubo un error de conexión con el asistente. Por favor, intenta de nuevo.", 'model');
    } finally {
        // Desbloqueo y enfoque automático de entrada de texto
        userInput.disabled = false;
        sendButton.disabled = false;
        userInput.focus();
    }
}


    // Inicialización del Chat de Respaldo por defecto
    document.addEventListener('DOMContentLoaded', () => {
        if (messageArea.children.length === 0) {
            conversationHistory = [];
            addMessage(welcomeMessage, 'model');
        }
    });
</script>
</body>
</html>

        const welcomeMessage = `Hola 👋 Soy el asistente virtual de Portal EducaDG. Estoy aquí para ayudarte a encontrar los mejores cursos online y programas ideales para llevar tu talento al siguiente nivel. 🚀 ¿En qué te puedo asesorar hoy?`;
        
        // 2. Función para añadir mensajes al área de chat (CON DETECTOR DE ENLACES MARKDOWN)
        function addMessage(text, role) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add(
                role === 'user' ? 'user-message' : 'bot-message',
                'whitespace-pre-wrap'
            );

            // Transforma [Texto](https://...) en un enlace HTML real clicable que abre en otra pestaña
            // Añade estilos en línea para que resalte y se lea perfectamente sobre el fondo azul
            let textoFormateado = text.replace(
                /\[([^\]]+)\]\(([^)]+)\)/g, 
                '<a href="$2" target="_blank" rel="noopener noreferrer" style="color: #ffffff; text-decoration: underline; font-weight: bold; cursor: pointer;">$1</a>'
            );

            messageDiv.innerHTML = textoFormateado; 
            messageArea.appendChild(messageDiv);
            
            if (text !== welcomeMessage && !text.startsWith("Escribiendo...")) {
                conversationHistory.push({ role, text });
            }
            
            messageArea.scrollTop = messageArea.scrollHeight;
        }

        // 3. Función para mostrar el indicador de carga del bot
        function showLoading() {
            const loadingDiv = document.createElement('div');
            loadingDiv.id = 'loadingIndicator';
            loadingDiv.classList.add('bot-message', 'flex', 'items-center', 'space-x-1');
            loadingDiv.innerHTML = `
                <span>Escribiendo...</span>
                <span class="loading-dot"></span>
                <span class="loading-dot"></span>
                <span class="loading-dot"></span>
            `;
            messageArea.appendChild(loadingDiv);
            messageArea.scrollTop = messageArea.scrollHeight;
            return loadingDiv;
        }

        // 4. Función para alternar la visibilidad de la ventana de chat
        function toggleChat() {
            const isOpen = chatWindow.classList.toggle('open');
            
            if (isOpen && messageArea.children.length === 0) {
                addMessage(welcomeMessage, 'bot');
                conversationHistory = [];
                conversationHistory.push({ role: 'model', text: welcomeMessage });
            }
            if (isOpen) {
                userInput.focus();
            }
        }
        
// 5. Función principal para enviar el mensaje (VERSIÓN ADAPTADA PARA PUENTE OPENROUTER)
async function sendMessage() {
    const userText = userInput.value.trim();
    if (userText === '') return;

    userInput.value = '';
    userInput.disabled = true;
    sendButton.disabled = true;

    // Muestra en pantalla el mensaje del usuario
    addMessage(userText, 'user');

    // Guardamos el mensaje en el historial local
    conversationHistory.push({ role: 'user', text: userText });

    // Prepara el historial manteniendo compatibilidad con la estructura esperada por tu Netlify function
    const payloadContents = conversationHistory.map(msg => ({
        role: msg.role === 'user' ? 'user' : 'model', 
        parts: [{ text: msg.text }]
    }));

    const loadingIndicator = showLoading();

    try {
        const payload = {
            contents: payloadContents
        };

        // Ruta a tu función de Netlify
        const coreUrl = "/.netlify/functions/gemini";

        const netOptions = {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
            // Quitamos las variables separadas innecesarias ya que OpenRouter procesa el System Prompt de forma segura en backend
        };

        let response = await window.fetch(coreUrl, netOptions);

        if (!response.ok) {
            throw new Error(`Error HTTP: ${response.status}`);
        }

        const result = await response.json();
        
        // Mapeo seguro para capturar el texto procesado por OpenRouter que viene desde tu backend
        const botResponse = result.candidates?.[0]?.content?.parts?.[0]?.text || "Disculpa, no pude procesar tu solicitud. Intenta de nuevo.";
        
        // Quita la animación de "Escribiendo..."
        if (loadingIndicator) {
            loadingIndicator.remove();
        }
        
        // Dibuja el mensaje en la pantalla de chat
        addMessage(botResponse, 'model'); 

        // Guardamos la respuesta del bot en el historial local
        conversationHistory.push({ role: 'model', text: botResponse });

    } catch (error) {
        console.error("Error al conectar con el backend de asistencia:", error);
        
        // Quita el mensaje de historial del usuario si ocurrió un fallo
        conversationHistory.pop(); 
        
        if (loadingIndicator) {
            loadingIndicator.remove();
        }
        
        addMessage("Lo siento, hubo un error de conexión con el asistente. Por favor, intenta de nuevo.", 'model');
    } finally {
        userInput.disabled = false;
        sendButton.disabled = false;
        userInput.focus();
    }
}

        
        document.addEventListener('DOMContentLoaded', () => {
            if (messageArea.children.length === 0) {
